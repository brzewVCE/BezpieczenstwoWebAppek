version: "3.9"

services:
  bwapp:
    build: .
    container_name: bwapp
    restart: unless-stopped
    # Uncomment bleow lines to make bwapp accesible by localhost:8080
    # Only use this when needed for debuging.    
#   ports:
#     - "8080:80"
    volumes:
      - bwapp_data:/var/lib/mysql

  nginx:
    image: nginx
    container_name: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"

volumes:
  bwapp_data:
